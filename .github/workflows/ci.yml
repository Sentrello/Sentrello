name: ci
# The same triggers as the other three repositories, which were tidied and
# this one was not.
#
# `push` with no filter beside `pull_request` runs CI twice for every commit
# on a branch with a pull request open — and again for every tag, over a
# commit that passed on `main` minutes earlier. Fifty-one runs on
# 26 September, for about twenty commits. Free on a public repository and
# still noise: a queue of duplicate runs is a slower answer to the question
# somebody is actually waiting on.
on:
  push:
    branches: [main]
    # No markdown or docs filter, deliberately.
    #
    # It read `paths-ignore: ["**/*.md", "docs/**", "LICENSE"]` until
    # 2026-09-29, which skipped CI for exactly the commits that can break the
    # tests reading those files — and there are several: the guard on what may
    # sit in `docs/`, the one that reads command lines out of the runbook, the
    # published-claims and diagram checks. A docs-only commit is the shape of
    # "somebody writes `docs/booking.md` on a Friday without thinking about
    # it", which is the sentence the first of those tests was written against.
    # The local pre-commit gate caught them; a push from anywhere else would
    # not have.
    paths-ignore: ["LICENSE"]
  pull_request:
    paths-ignore: ["LICENSE"]
  # For asking the question on purpose.
  workflow_dispatch:
# One run per branch. A second push supersedes the first rather than
# paying for both — a 66-minute job left running for a commit nobody
# will ever look at again is the shape of an Actions bill.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sign-off, checked rather than asked for.
  #
  # CONTRIBUTING.md and the pull-request template both called a `Signed-off-by`
  # line mandatory, and nothing anywhere had ever looked: not one commit in this
  # repository's history carries one, including every commit that wrote the rule
  # down. A requirement nobody enforces is a requirement the first outside
  # contributor meets by accident or not at all, and the DCO is the only thing
  # standing in for a contributor agreement here — there is no CLA to fall back
  # on.
  #
  # On pull requests only. Work pushed straight to `main` is the owner's own,
  # which is the one case the certificate has nothing to certify.
  sign-off:
    if: github.event_name == 'pull_request'
    # Pinned, not floating, until after launch.
    #
    # `ubuntu-latest` migrates to Ubuntu 26 from 19 October 2026, and GitHub says
    # so in an annotation on every run. The suite here is Bun, a Postgres service
    # container, a typecheck and a linter, none of which has an obvious reason to
    # mind — but "no obvious reason" is not a thing to find out about from a red
    # build on the public repository in the fortnight either side of v1.
    #
    # Revisit once launch is behind us: a pin is maintenance of its own, and
    # GitHub retires an image eventually. The point of the date in this comment is
    # that somebody can tell how stale the decision is.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Just the commits the pull request adds, and their full messages — a
      # shallow clone has neither.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit in this pull request certifies its origin
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            # The author's own line, not merely any sign-off: a message carrying
            # somebody else's would pass a plain grep for the phrase.
            author="$(git show -s --format='Signed-off-by: %an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qxF "$author"; then
              echo "::error::$(git show -s --format='%h %s' "$sha")"
              echo "    needs: $author"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" = 1 ]; then
            echo "::error::Sign off with 'git commit -s --amend', or 'git rebase --signoff $BASE' for several. CONTRIBUTING.md says what it certifies."
            exit 1
          fi
          echo "every commit signed off"

  build:
    # Pinned for the reason given on the job above.
    runs-on: ubuntu-24.04
    # A hung job is billed like a working one.
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/sentrello/postgres:17
        env: { POSTGRES_USER: sentrello, POSTGRES_PASSWORD: sentrello, POSTGRES_DB: sentrello_t_core }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentrello" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sentrello:sentrello@localhost:5432/sentrello_t_core
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci-0123456789abcdef
      SENTRELLO_BASE_URL: http://localhost:3000
      SENTRELLO_INSTANCE_ID: ci-instance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install
      # No licence key or token: nothing here needs one. The suite trusts
      # only the keys built into the core, and every test that exercises a
      # signed token generates its own throwaway keypair. This runs on Free.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run test
      # On its own, because these need the organizations table empty and Bun
      # runs the files at the same time. The reasoning is in the file.
      - run: bun test --timeout 30000 ./packages/auth/src/bootstrap-claim.alone.ts
      - run: bun run build:web
